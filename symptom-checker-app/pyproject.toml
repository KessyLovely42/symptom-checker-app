[tool.poetry]
name = "symptom-checker-app"
version = "0.1.0"
description = "Intelligent support system to predict disease based on symptoms proided by users"
authors = ["Kessy Okundia, Victor Robinson"]
license = "public"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^2.1.3"
pandas = "^2.2.3"
matplotlib = "^3.9.2"
seaborn = "^0.13.2"
scikit-learn = "^1.5.2"
imblearn = "^0.0"
ipykernel = "^6.29.5"
missingno = "^0.5.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
